name: Android release

# Builds the APK. On a version tag (v0.1.0, ...) it is attached to a GitHub Release.
# Needs the repository variables API_BASE_URL and PUBLIC_WEB_URL (the GitHub Pages address).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    if: vars.API_BASE_URL != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
          --dart-define=PUBLIC_WEB_URL=${{ vars.PUBLIC_WEB_URL }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/wearmony.apk
      - uses: actions/upload-artifact@v4
        with:
          name: wearmony-apk
          path: app/build/app/outputs/flutter-apk/wearmony.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: app/build/app/outputs/flutter-apk/wearmony.apk
